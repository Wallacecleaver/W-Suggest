<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<title>W Suggest — Connexion</title>
	<link rel="icon" href="/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/dashboard/assets/dashboard.css">
</head>
<body class="auth-page">
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<defs>
			<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
			<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></symbol>
		</defs>
	</svg>

	<main class="auth-card">
		<div class="addon-logo"><img src="/logo.png" alt="Logo de W Suggest" style="width:100%;height:100%;object-fit:cover;border-radius:20px;"></div>
		<h1>Tableau de bord</h1>
		<p class="lead">Connecte-toi pour surveiller W Suggest : trafic, cache, journaux et fournisseurs.</p>

		<div id="errorBox" class="error-message" role="alert"></div>

		<form id="loginForm">
			<div class="field">
				<label for="password">Mot de passe d’administration</label>
				<div class="input-wrapper">
					<input type="password" id="password" name="password" placeholder="Défini dans ton fichier .env" required autocomplete="current-password" autofocus>
					<button type="button" class="toggle-btn" id="togglePassword" title="Afficher ou masquer le mot de passe" aria-label="Afficher ou masquer le mot de passe">
						<svg class="icon" id="eyeIcon" aria-hidden="true"><use href="#i-eye"/></svg>
					</button>
				</div>
			</div>

			<button type="submit" class="btn-submit" id="submitBtn">
				<span class="spinner" id="spinner"></span>
				<span id="btnText">Se connecter</span>
			</button>
		</form>

		<div class="footer-links"><a href="/configure">Retour à la configuration de l’addon</a></div>
	</main>

	<script>
		const form = document.getElementById("loginForm");
		const passwordInput = document.getElementById("password");
		const togglePassword = document.getElementById("togglePassword");
		const eyeIcon = document.getElementById("eyeIcon");
		const errorBox = document.getElementById("errorBox");
		const submitBtn = document.getElementById("submitBtn");
		const spinner = document.getElementById("spinner");
		const btnText = document.getElementById("btnText");

		togglePassword.addEventListener("click", () => {
			const hidden = passwordInput.getAttribute("type") === "password";
			passwordInput.setAttribute("type", hidden ? "text" : "password");
			eyeIcon.querySelector("use").setAttribute("href", hidden ? "#i-eye-off" : "#i-eye");
		});

		form.addEventListener("submit", async (e) => {
			e.preventDefault();
			errorBox.style.display = "none";
			submitBtn.disabled = true;
			spinner.style.display = "inline-block";
			btnText.textContent = "Vérification…";

			try {
				const response = await fetch("/dashboard/api/login", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ password: passwordInput.value })
				});

				const data = await response.json();

				if (response.ok && data.success) {
					btnText.textContent = "Connecté, redirection…";
					window.location.href = "/dashboard";
					return;
				}
				errorBox.textContent = data.error || "Mot de passe incorrect";
				errorBox.style.display = "block";
				passwordInput.focus();
				passwordInput.select();
			} catch (err) {
				errorBox.textContent = "Impossible de joindre le serveur. Réessaie dans un instant.";
				errorBox.style.display = "block";
			}
			submitBtn.disabled = false;
			spinner.style.display = "none";
			btnText.textContent = "Se connecter";
		});
	</script>
</body>
</html>

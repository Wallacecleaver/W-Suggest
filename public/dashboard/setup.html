<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<title>W Suggest — Activer le tableau de bord</title>
	<link rel="icon" href="/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/dashboard/assets/dashboard.css">
</head>
<body class="auth-page">
	<main class="auth-card" style="max-width: 500px;">
		<div class="addon-logo"><img src="/logo.png" alt="Logo de W Suggest" style="width:100%;height:100%;object-fit:cover;border-radius:20px;"></div>
		<h1>Tableau de bord désactivé</h1>
		<p class="lead">L’accès au tableau de bord exige un mot de passe, défini dans le fichier <code>.env</code> du serveur.</p>

		<div class="notice">Ajoute la variable ci-dessous à ton <code>.env</code>, puis redémarre le serveur.</div>

		<div class="code-box">
			<span class="comment"># .env</span>
			<span>DASHBOARD_PASSWORD=choisis-un-mot-de-passe-solide</span>
		</div>

		<a href="/configure" class="btn">Aller à la configuration de l’addon</a>
	</main>
</body>
</html>

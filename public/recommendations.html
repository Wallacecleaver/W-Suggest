<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<meta name="robots" content="noindex">
	<title>Recommandations · W Suggest</title>
	<link rel="icon" href="/logo.png">
	<link rel="stylesheet" href="/recommendations.css">
	<script defer src="/recommendations.js"></script>
</head>
<body>
	<header class="brand"><img src="/logo.png" alt="" width="34" height="34"> W Suggest</header>
	<main>
		<p id="status" role="status">Chargement des recommandations…</p>
		<button id="retry" type="button" hidden>Réessayer</button>
		<section id="hero" class="hero" hidden>
			<img id="backdrop" class="backdrop" alt="" hidden>
			<div class="intro">
				<p id="facts"></p>
				<h1 id="title"></h1>
				<p id="summary"></p>
				<a id="original" class="action">Voir la fiche dans Stremio</a>
			</div>
		</section>
		<section id="results" class="results" hidden aria-labelledby="results-title">
			<h2 id="results-title">À découvrir ensuite</h2>
			<ul id="cards"></ul>
			<p id="empty" hidden>Aucune recommandation trouvée avec tes sources actives.</p>
		</section>
	</main>
</body>
</html>

version: "3.8"

services:
  w-suggest:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - SQLITE_PATH=/app/data/cache.sqlite
      - ENABLE_LOGGING=${ENABLE_LOGGING:-false}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CACHE_TTL=${CACHE_TTL:-259200}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-3000}
      - GEMINI_MAX_RESULT=${GEMINI_MAX_RESULT:-20}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

